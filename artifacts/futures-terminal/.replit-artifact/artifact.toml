kind = "mobile"
previewPath = "/futures-terminal/"
title = "Futures Terminal"
description = "A personal Binance USD-M Futures trading control center for iOS and Android. Features a professional dark trading interface with dashboard, account/PNL summary, open positions, watchlist, strategy controls, multi-timeframe LONG/SHORT scoring, risk controls, trade history, strategy logs, engine status, and emergency stop. Runs in paper/mock mode for the first version with architecture ready for VPS connection."
version = "1.0.0"
id = "artifacts/futures-terminal"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/futures-terminal/" ]
localPort = 26245

[services.development]
run = "pnpm --filter @workspace/futures-terminal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/futures-terminal", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/futures-terminal", "run", "serve" ]

[services.env]
PORT = "26245"
BASE_PATH = "/futures-terminal/"
